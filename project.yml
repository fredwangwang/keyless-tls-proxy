name: MacTokenApp
options:
  bundleIdPrefix: com.fredprx.mactoken
  deploymentTarget:
    macOS: "11.0"
  createIntermediateGroups: true
  generateTargetsWithSharedSchemes: true
  postGenCommand: "python3 -c \"import re; p='MacTokenApp.xcodeproj/xcshareddata/xcschemes/MacTokenExtension.xcscheme'; txt=open(p).read(); txt=txt.replace('launchStyle = \\\"0\\\"', 'launchStyle = \\\"1\\\"').replace('selectedDebuggerIdentifier = \\\"\\\"', 'selectedDebuggerIdentifier = \\\"Xcode.DebuggerFoundation.Debugger.LLDB\\\"').replace('selectedLauncherIdentifier = \\\"Xcode.IDEFoundation.Launcher.PosixSpawn\\\"', 'selectedLauncherIdentifier = \\\"Xcode.DebuggerFoundation.Launcher.LLDB\\\"'); open(p,'w').write(txt)\""

schemes:
  MacTokenApp:
    build:
      targets:
        MacTokenApp: all
        MacTokenExtension: all
    run:
      config: Debug
    archive:
      config: Release
  MacTokenExtension:
    build:
      targets:
        MacTokenExtension: all
    run:
      config: Debug
    archive:
      config: Release


targets:
  MacTokenExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: mac-provider/TokenDriver.h
      - path: mac-provider/TokenDriver.m
      - path: mac-provider/Token.h
      - path: mac-provider/Token.m
      - path: mac-provider/TokenSession.h
      - path: mac-provider/TokenSession.m
    dependencies:
      - sdk: Foundation.framework
      - sdk: Security.framework
      - sdk: CryptoTokenKit.framework
      - sdk: libresolv.tbd
    postBuildScripts:
      - name: "Copy Certs Resources"
        script: |
          DEST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/certs"
          mkdir -p "$DEST_DIR"
          cp -R "${PROJECT_DIR}/certs/"* "$DEST_DIR/"
    preBuildScripts:
      - name: "Build Go C-Archive (libctkbridge.a)"
        inputFiles:
          - $(PROJECT_DIR)/go.mod
          - $(PROJECT_DIR)/go.sum
          - $(PROJECT_DIR)/internal/ctkbridge/bridge.go
          - $(PROJECT_DIR)/internal/kspclient/client.go
          - $(PROJECT_DIR)/internal/kspclient/config.go
          - $(PROJECT_DIR)/internal/kspcommon/paths.go
          - $(PROJECT_DIR)/internal/kspmanifest/manifest.go
          - $(PROJECT_DIR)/internal/tlsutil/tls.go
          - $(PROJECT_DIR)/gen/cert/v1/cert.pb.go
          - $(PROJECT_DIR)/gen/cert/v1/cert_grpc.pb.go
        outputFiles:
          - $(PROJECT_DIR)/build/libctkbridge.a
          - $(PROJECT_DIR)/build/libctkbridge.h
        script: |
          if [ -f "$PROJECT_DIR/go.mod" ]; then
            cd "$PROJECT_DIR"
          fi
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          mkdir -p build
          TARGET_ARCHS="${ARCHS:-$(uname -m)}"
          rm -f build/libctkbridge_*.a build/libctkbridge_*.h
          BUILD_LIBS=()
          LAST_HEADER=""
          for ARCH in $TARGET_ARCHS; do
              GO_ARCH=""
              case "$ARCH" in
                  arm64|arm64e) GO_ARCH="arm64" ;;
                  x86_64|amd64) GO_ARCH="amd64" ;;
              esac
              if [ -n "$GO_ARCH" ]; then
                  ARCH_LIB="build/libctkbridge_${GO_ARCH}.a"
                  ARCH_HDR="build/libctkbridge_${GO_ARCH}.h"
                  if [ ! -f "$ARCH_LIB" ]; then
                      GOOS=darwin GOARCH="$GO_ARCH" CGO_ENABLED=1 go build -buildmode=c-archive -o "$ARCH_LIB" ./internal/ctkbridge
                  fi
                  BUILD_LIBS+=("$ARCH_LIB")
                  LAST_HEADER="$ARCH_HDR"
              fi
          done
          rm -f build/libctkbridge.a build/libctkbridge.h
          if [ -n "$LAST_HEADER" ] && [ -f "$LAST_HEADER" ]; then
              cp "$LAST_HEADER" build/libctkbridge.h
          fi
          if [ ${#BUILD_LIBS[@]} -eq 1 ]; then
              cp "${BUILD_LIBS[0]}" build/libctkbridge.a
          elif [ ${#BUILD_LIBS[@]} -gt 1 ]; then
              lipo -create "${BUILD_LIBS[@]}" -output build/libctkbridge.a
          fi
    settings:
      base:
        DEVELOPMENT_TEAM: 8Z93635RW6
        PRODUCT_BUNDLE_IDENTIFIER: com.fredprx.mactoken.app.extension
        INFOPLIST_FILE: mac-provider/Extension-Info.plist
        CODE_SIGN_ENTITLEMENTS: mac-provider/extension.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        OTHER_CODE_SIGN_FLAGS: "--team-identifier 8Z93635RW6"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/build $(PROJECT_DIR)/mac-provider"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/build"
        OTHER_LDFLAGS: "$(PROJECT_DIR)/build/libctkbridge.a -lresolv -lpthread"

  MacTokenApp:
    type: application
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: mac-provider/AppMain.m
    dependencies:
      - target: MacTokenExtension
        embed: true
      - sdk: Cocoa.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    postBuildScripts:
      - name: "Copy Certs Resources"
        script: |
          DEST_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/certs"
          mkdir -p "$DEST_DIR"
          cp -R "${PROJECT_DIR}/certs/"* "$DEST_DIR/"
    settings:
      base:
        DEVELOPMENT_TEAM: 8Z93635RW6
        PRODUCT_BUNDLE_IDENTIFIER: com.fredprx.mactoken.app
        INFOPLIST_FILE: mac-provider/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: mac-provider/app.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        OTHER_CODE_SIGN_FLAGS: "--team-identifier 8Z93635RW6"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/build $(PROJECT_DIR)/mac-provider"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/build"
        OTHER_LDFLAGS: "$(PROJECT_DIR)/build/libctkbridge.a -lresolv -lpthread"
